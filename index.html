<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ベビーセーフ・ルーム</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <!-- 左：ゲーム画面（描画層 + HTML の HUD / 各画面）。右：できごとログ -->
  <div id="stage">
    <!-- 描画層（Canvas2D / Three.js）がここに描く -->
    <div id="game"></div>
    <!-- HUD・各画面（Title/Loading/Tutorial/Result）は HTML をゲーム画面に重ねる -->
    <div id="ui"></div>
  </div>
  <!-- できごとログ（失敗・成功のときに何が起きたかを欄外で説明する。ui.js が更新） -->
  <aside id="log" aria-label="できごと"></aside>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
